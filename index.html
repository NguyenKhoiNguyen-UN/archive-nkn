<!DOCTYPE html>
<html lang="vi">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Archive NKN</title>
<link rel="stylesheet" href="globals.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Shared icon sprite: edit an icon once here, it updates everywhere it's used with <use>. -->
<svg style="display:none" aria-hidden="true">
  <symbol id="icon-archive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
    <rect x="3" y="4" width="18" height="5" rx="1"/>
    <path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/>
    <path d="M10 13h4"/>
  </symbol>
  <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="11" cy="11" r="7"/>
    <path d="M21 21l-4.3-4.3"/>
  </symbol>
  <symbol id="icon-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M8 6h13M8 12h13M8 18h13"/>
    <path d="M3 6h.01M3 12h.01M3 18h.01"/>
  </symbol>
  <symbol id="icon-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <rect x="3" y="3" width="7" height="7" rx="1"/>
    <rect x="14" y="3" width="7" height="7" rx="1"/>
    <rect x="3" y="14" width="7" height="7" rx="1"/>
    <rect x="14" y="14" width="7" height="7" rx="1"/>
  </symbol>
  <symbol id="icon-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
    <path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z"/>
    <path d="M14 2v6h6"/>
  </symbol>
  <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M12 3v12"/>
    <path d="M7 11l5 5 5-5"/>
    <path d="M5 20h14"/>
  </symbol>
  <symbol id="icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M6 9l6 6 6-6"/>
  </symbol>
</svg>

<main class="desktop">

  <header class="topbar">
    <a class="brand" href="/" aria-label="Archive NKN — trang chủ">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-archive"/></svg>
      <span class="brand-name">Archive NKN</span>
    </a>
    <nav class="nav" aria-label="Điều hướng chính">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link is-current" href="/archive" aria-current="page">Archive</a>
    </nav>
  </header>

  <section class="toolbar" aria-label="Tìm kiếm và chế độ xem">
    <form class="search" role="search">
      <input class="search-input" type="search" name="search" placeholder="Tìm file" aria-label="Tìm file trong archive">
      <button class="search-btn" type="submit" aria-label="Tìm">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-search"/></svg>
      </button>
    </form>
    <div class="view-toggle" role="group" aria-label="Kiểu hiển thị">
      <button class="view-btn" type="button" data-view="list" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-list"/></svg>
        <span>List view</span>
      </button>
      <button class="view-btn is-active" type="button" data-view="grid" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-grid"/></svg>
        <span>Grid view</span>
      </button>
    </div>
  </section>

  <section class="section-heading">
    <h1 class="section-title">Recents</h1>
    <button class="collapse-btn" type="button" aria-expanded="true" aria-controls="recent-files">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron"/></svg>
    </button>
  </section>

  <!--
    ĐỂ THÊM FILE MỚI: copy 1 khối <li class="file-row"> bên dưới, dán vào đầu <ul>,
    rồi sửa 3 chỗ: tên file (file-name), kích thước (file-size), link tải (href).
    Ngày sẽ để trống nếu không cần, hoặc sửa datetime + nội dung trong <time>.
  -->
  <ul class="file-list" id="recent-files" aria-label="Danh sách file gần đây">

    <li class="file-row">
      <div class="file-info">
        <svg class="file-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-file"/></svg>
        <span class="file-name">fileenxoska.bat</span>
      </div>
      <span class="file-size">3,33 KB</span>
      <time class="file-date" datetime="2026-09-17">17/09/2026</time>
      <a class="file-download" href="#" download aria-label="Tải fileenxoska.bat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-download"/></svg>
      </a>
    </li>

    <li class="file-row">
      <div class="file-info">
        <svg class="file-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-file"/></svg>
        <span class="file-name">fileenxoska.bat</span>
      </div>
      <span class="file-size">3,33 KB</span>
      <time class="file-date" datetime="2026-09-17">17/09/2026</time>
      <a class="file-download" href="#" download aria-label="Tải fileenxoska.bat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-download"/></svg>
      </a>
    </li>

    <li class="file-row">
      <div class="file-info">
        <svg class="file-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-file"/></svg>
        <span class="file-name">fileenxoska.bat</span>
      </div>
      <span class="file-size">3,33 KB</span>
      <time class="file-date" datetime="2026-09-17">17/09/2026</time>
      <a class="file-download" href="#" download aria-label="Tải fileenxoska.bat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-download"/></svg>
      </a>
    </li>

  </ul>

</main>

<script>
  // Toggle List / Grid view button state (visual only for now — layout is list-style either way).
  document.querySelectorAll('.view-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.view-btn').forEach(function (b) {
        b.classList.remove('is-active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('is-active');
      btn.setAttribute('aria-pressed', 'true');
    });
  });
</script>

</body>
</html>
