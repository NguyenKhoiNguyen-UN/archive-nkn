<!DOCTYPE html>
<html lang="vi">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Archive — Archive NKN</title>
<link rel="icon" type="image/png" href="./open-folder-icon-dark.png">
<link rel="stylesheet" href="globals.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Shared icon sprite: edit an icon once here, it updates everywhere it's used with <use>. -->
<svg style="display:none" aria-hidden="true">
  <symbol id="icon-archive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
    <rect x="3" y="4" width="18" height="5" rx="1"/>
    <path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/>
    <path d="M10 13h4"/>
  </symbol>
  <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="11" cy="11" r="7"/>
    <path d="M21 21l-4.3-4.3"/>
  </symbol>
  <symbol id="icon-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
    <path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z"/>
    <path d="M14 2v6h6"/>
  </symbol>
  <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M12 3v12"/>
    <path d="M7 11l5 5 5-5"/>
    <path d="M5 20h14"/>
  </symbol>
  <symbol id="icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M6 9l6 6 6-6"/>
  </symbol>
</svg>

<main class="desktop">

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Archive NKN — trang chủ">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-archive"/></svg>
      <span class="brand-name">Archive NKN</span>
    </a>
    <nav class="nav" aria-label="Điều hướng chính">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link is-current" href="archive.html" aria-current="page">Archive</a>
    </nav>
  </header>

  <section class="toolbar" aria-label="Tìm kiếm">
    <form class="search" role="search">
      <input class="search-input" type="search" name="search" placeholder="Search" aria-label="Search files">
      <button class="search-btn" type="submit" aria-label="Tìm">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-search"/></svg>
      </button>
    </form>
  </section>

  <section class="section-heading">
    <h1 class="section-title">Recents</h1>

    <details class="sort">
      <summary class="sort-btn" aria-label="Sắp xếp danh sách">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron"/></svg>
      </summary>
      <ul class="sort-menu" role="menu">
        <li role="menuitem"><button type="button" data-sort="date-desc">Mới nhất</button></li>
        <li role="menuitem"><button type="button" data-sort="date-asc">Cũ nhất</button></li>
        <li role="menuitem"><button type="button" data-sort="size-desc">Nặng nhất</button></li>
        <li role="menuitem"><button type="button" data-sort="size-asc">Nhẹ nhất</button></li>
      </ul>
    </details>
  </section>

  <!--
    ĐỂ THÊM FILE MỚI: mở file "files.txt" (nằm cùng thư mục), thêm 1 dòng theo cú pháp
    có ghi sẵn trong đó. KHÔNG cần sửa gì trong file HTML này nữa.
  -->
  <ul class="file-list" id="recent-files" aria-label="Danh sách file gần đây"></ul>
  <p class="list-status" id="list-status" hidden></p>

</main>

<script>
  var fileList = document.getElementById('recent-files');
  var listStatus = document.getElementById('list-status');
  var searchForm = document.querySelector('.search');
  var searchInput = document.querySelector('.search-input');
  var sortDetails = document.querySelector('.sort');

  var svgFile = '<svg class="file-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-file"/></svg>';
  var svgDownload = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-download"/></svg>';

  // "3.33 KB" / "3,33 KB" / "12 MB" / "1.2 GB" / "500 B" -> số byte
  function sizeToBytes(sizeText) {
    var match = sizeText.trim().match(/^([\d.,]+)\s*(B|KB|MB|GB)$/i);
    if (!match) return 0;
    var num = parseFloat(match[1].replace(',', '.'));
    var unit = match[2].toUpperCase();
    var mult = unit === 'GB' ? 1024 * 1024 * 1024 : unit === 'MB' ? 1024 * 1024 : unit === 'KB' ? 1024 : 1;
    return Math.round(num * mult);
  }

  // Đọc files.txt theo cú pháp: Tên | Dung lượng | Ngày | Link
  function parseFilesTxt(text) {
    return text.split('\n')
      .map(function (line) { return line.trim(); })
      .filter(function (line) { return line && line.indexOf('#') !== 0; })
      .map(function (line) {
        var parts = line.split('|').map(function (p) { return p.trim(); });
        if (parts.length < 4) return null;
        return { name: parts[0], size: parts[1], date: parts[2], link: parts[3] };
      })
      .filter(Boolean);
  }

  function renderFiles(files) {
    fileList.innerHTML = '';

    if (files.length === 0) {
      listStatus.hidden = false;
      listStatus.textContent = 'Chưa có file nào.';
      return;
    }

    listStatus.hidden = true;

    files.forEach(function (file) {
      var li = document.createElement('li');
      li.className = 'file-row';
      li.dataset.bytes = sizeToBytes(file.size);
      li.innerHTML =
        '<div class="file-info">' + svgFile +
          '<span class="file-name">' + file.name + '</span>' +
        '</div>' +
        '<span class="file-size">' + file.size + '</span>' +
        '<time class="file-date" datetime="' + file.date + '">' + formatDate(file.date) + '</time>' +
        '<a class="file-download" href="' + file.link + '" download aria-label="Tải ' + file.name + '">' + svgDownload + '</a>';
      fileList.appendChild(li);
    });
  }

  // "2026-09-17" -> "17/09/2026"
  function formatDate(iso) {
    var parts = iso.split('-');
    return parts.length === 3 ? parts[2] + '/' + parts[1] + '/' + parts[0] : iso;
  }

  fetch('files.txt')
    .then(function (res) {
      if (!res.ok) throw new Error('not ok');
      return res.text();
    })
    .then(function (text) {
      var files = parseFilesTxt(text);
      files.sort(function (a, b) { return b.date.localeCompare(a.date); }); // mặc định: mới nhất trước
      renderFiles(files);
    })
    .catch(function () {
      listStatus.hidden = false;
      listStatus.textContent = 'Không tải được danh sách file — trang cần được mở qua server thật (GitHub Pages), không phải mở file trực tiếp trên máy/điện thoại.';
    });

  // --- Search: lọc file theo tên, gõ tới đâu lọc tới đó ---
  searchForm.addEventListener('submit', function (e) {
    e.preventDefault();
  });

  searchInput.addEventListener('input', function () {
    var query = searchInput.value.trim().toLowerCase();
    var rows = fileList.querySelectorAll('.file-row');

    rows.forEach(function (row) {
      var name = row.querySelector('.file-name').textContent.toLowerCase();
      row.hidden = query.length > 0 && !name.includes(query);
    });
  });

  // --- Sắp xếp: Mới nhất / Cũ nhất / Nặng nhất / Nhẹ nhất ---
  document.querySelectorAll('[data-sort]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var mode = btn.dataset.sort;
      var rows = Array.prototype.slice.call(fileList.querySelectorAll('.file-row'));

      rows.sort(function (a, b) {
        if (mode === 'date-desc' || mode === 'date-asc') {
          var da = a.querySelector('time').getAttribute('datetime');
          var db = b.querySelector('time').getAttribute('datetime');
          return mode === 'date-desc' ? db.localeCompare(da) : da.localeCompare(db);
        } else {
          var sa = Number(a.dataset.bytes) || 0;
          var sb = Number(b.dataset.bytes) || 0;
          return mode === 'size-desc' ? sb - sa : sa - sb;
        }
      });

      rows.forEach(function (row) { fileList.appendChild(row); });
      sortDetails.removeAttribute('open');
    });
  });

  // Đóng menu sắp xếp khi bấm ra ngoài
  document.addEventListener('click', function (e) {
    if (sortDetails.hasAttribute('open') && !sortDetails.contains(e.target)) {
      sortDetails.removeAttribute('open');
    }
  });
</script>

</body>
</html>
